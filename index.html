<script>
// 구글 애널리틱스(GA4): 아래 측정 ID를 본인 것(G-로 시작)으로 바꾸면 켜져요.
const GA_ID='G-XXXXXXXXXX';
const GA_ON=!GA_ID.includes('XXXX');
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
if(GA_ON){
  const t=document.createElement('script');t.async=true;
  t.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(t);
  gtag('js',new Date());gtag('config',GA_ID);
}
const track=n=>{if(GA_ON)gtag('event',n);};

<style>

      <label><input type="checkbox" id="ag"> 만 19세 이상이며 <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침·이용 안내</a>에 동의합니다.</label>

<script>
const W=90,H=60,C=10,PS=32,BALLS=1;
const LOBBY='ttang-lobby-v1-',SLOTS=20;
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');cv.width=W*C;cv.height=H*C;
const ly=document.createElement('canvas'),lg=ly.getContext('2d');
ly.width=cv.width;ly.height=cv.height;
const mks=[null,document.createElement('canvas'),document.createElement('canvas')]; // 플레이어별 영역 마스크
mks.slice(1).forEach(m=>{m.width=W;m.height=H;});
const lv=$('lv'),rv=$('rv');
const DX=[0,0,1,0,-1],DY=[0,-1,0,1,0]; // 1 위, 2 오른쪽, 3 아래, 4 왼쪽
const COL=['','#f4b942','#ff6fae'];
const TINT=['','rgba(244,185,66,.22)','rgba(255,111,174,.22)'],SOLID=['','rgba(244,185,66,.85)','rgba(255,111,174,.85)'];
const HOME=[null,[4,30],[85,30]];

let grid,balls=[],tr=[null,[],[]],un=[null,[],[]],pos=[null,[4,30],[85,30]],base=new Uint8Array(W*H),dirs=[0,0,0],deaths=[0,0,0],pct=[0,0,0];
let consented=false,echoMode=false,role=0,state='menu',acc=0,last=0,sendT=0,flash=0;
let local=null,peer=null,lobby=null,conn=null,call=null,session=0,obAct=null;

/* ---------- 게임 규칙 (호스트가 계산) ---------- */
function initGame(){
  grid=new Uint8Array(W*H);
  base=new Uint8Array(W*H); // 시작 영역(기지): 상대가 들어오거나 차지할 수 없음
  for(let y=24;y<=35;y++)for(let x=0;x<=8;x++){
    grid[y*W+x]=1;base[y*W+x]=1;grid[y*W+W-1-x]=2;base[y*W+W-1-x]=2;
  }
  tr=[null,[],[]];un=[null,[],[]];pos=[null,HOME[1].slice(),HOME[2].slice()];dirs=[0,0,0];deaths=[0,0,0];acc=0;
  balls=[];
  for(let i=0;i<BALLS;i++){let a=Math.random()*6.28;if(Math.abs(Math.sin(2*a))<.3)a+=.5;balls.push({x:45,y:30,a,s:18});}
  calc();
}
function calc(){
  let a=0,b=0;
  for(let i=0;i<grid.length;i++){const v=grid[i];if(v===1)a++;else if(v===2)b++;}
  pct=[0,a/grid.length*100,b/grid.length*100];
  for(let k=1;k<=2;k++){
    const im=new ImageData(W,H);
    for(let i=0;i<grid.length;i++)if(grid[i]===k)im.data[i*4+3]=255;
    mks[k].getContext('2d').putImageData(im,0,0);
  }
  const me=role||1,you=3-me;
  $('me').textContent=Math.floor(pct[me])+'%';$('me').style.color=COL[me];
  $('you').textContent=Math.floor(pct[you])+'%';$('you').style.color=COL[you];
}
const at=(x,y)=>{const cx=Math.floor(x),cy=Math.floor(y);return(cx<0||cy<0||cx>=W||cy>=H)?1:grid[cy*W+cx];};
function die(k){ // 선이 끊기면 지워지고 내 집으로 복귀
  for(let j=0;j<tr[k].length;j++)grid[tr[k][j]]=un[k][j];
  tr[k]=[];un[k]=[];dirs[k]=0;deaths[k]++;pos[k]=HOME[k].slice();
  if(k===role)flash=18;
  calc();
}
function stepPlayer(k){
  const d=dirs[k];if(!d)return;
  const o=3-k,nx=pos[k][0]+DX[d],ny=pos[k][1]+DY[d];
  if(nx<0||ny<0||nx>=W||ny>=H)return;
  const i=ny*W+nx;
  if(base[i]&&base[i]!==k)return; // 상대 기지에는 못 들어감
  if(grid[i]===k+2)return;      // 내 선은 못 지나감
  if(grid[i]===o+2)die(o);      // 상대 선을 끊음
  const v=grid[i];
  pos[k]=[nx,ny];
  if(v===k){if(tr[k].length)capture(k);}
  else{tr[k].push(i);un[k].push(v);grid[i]=k+2;}
}
function capture(k){
  const o=3-k;
  for(const i of tr[k])grid[i]=k;
  tr[k]=[];un[k]=[];dirs[k]=0;
  const seen=new Uint8Array(W*H),st=[];
  const open=j=>grid[j]!==k&&!base[j]; // 기지는 에워싸도 차지할 수 없음
  for(const b of balls){const i=Math.floor(b.y)*W+Math.floor(b.x);if(!seen[i]&&open(i)){seen[i]=1;st.push(i);}}
  const add=j=>{if(!seen[j]&&open(j)){seen[j]=1;st.push(j);}};
  while(st.length){
    const i=st.pop(),x=i%W,y=(i/W)|0;
    if(x>0)add(i-1);if(x<W-1)add(i+1);if(y>0)add(i-W);if(y<H-1)add(i+W);
  }
  const pi=pos[o][1]*W+pos[o][0];
  let cut=open(pi)&&!seen[pi]; // 상대가 서 있는 자리를 에워쌌다
  for(let i=0;i<grid.length&&!cut;i++)if(grid[i]===o+2&&!seen[i])cut=true; // 상대의 선을 에워쌌다
  if(cut)die(o);
  for(let i=0;i<grid.length;i++)if(open(i)&&!seen[i])grid[i]=k;
  calc();
}
function stepBall(b,dt){
  const d=b.s*dt,n=Math.max(1,Math.ceil(d/.3)),s=d/n;
  for(let i=0;i<n;i++){
    let vx=Math.cos(b.a),vy=Math.sin(b.a);
    const nx=b.x+vx*s,ny=b.y+vy*s,cx=at(nx,b.y),cy=at(b.x,ny),cd=at(nx,ny);
    const hit=[cx,cy,cd].find(v=>v>=3);
    if(hit){die(hit-2);return true;}
    let hx=cx!==0,hy=cy!==0;
    if(!hx&&!hy&&cd!==0)hx=hy=true;
    if(hx||hy){if(hx)vx=-vx;if(hy)vy=-vy;b.a=Math.atan2(vy,vx)+(Math.random()-.5)*.1;continue;}
    b.x=nx;b.y=ny;
  }
  return false;
}

/* ---------- 네트워크 ---------- */
const enc=()=>{const a=[];let p=grid[0],n=1;for(let i=1;i<grid.length;i++){if(grid[i]===p)n++;else{a.push(p,n);p=grid[i];n=1;}}a.push(p,n);return a;};
const dec=a=>{let j=0;for(let i=0;i<a.length;i+=2){grid.fill(a[i],j,j+a[i+1]);j+=a[i+1];}};
const isN=Number.isFinite;
function decOk(a){ // 상대가 보낸 땅 정보가 올바른 형식인지 확인
  if(!Array.isArray(a)||a.length%2||a.length>W*H*2)return false;
  let n=0;
  for(let i=0;i<a.length;i+=2){
    const v=a[i],c=a[i+1];
    if(!(Number.isInteger(v)&&v>=0&&v<=4&&Number.isInteger(c)&&c>0))return false;
    n+=c;if(n>W*H)return false;
  }
  return n===W*H;
}
function stOk(d){
  return decOk(d.g)&&Array.isArray(d.b)&&d.b.length<=8&&d.b.every(b=>Array.isArray(b)&&b.length===4&&b.every(isN))
    &&Array.isArray(d.p)&&d.p.length===3&&[1,2].every(k=>Array.isArray(d.p[k])&&Number.isInteger(d.p[k][0])&&Number.isInteger(d.p[k][1])&&d.p[k][0]>=0&&d.p[k][0]<W&&d.p[k][1]>=0&&d.p[k][1]<H)
    &&Array.isArray(d.d)&&d.d.length===3&&d.d.every(isN);
}
function onData(d){
  if(!d||typeof d!=='object')return;
  if(role===1&&d.t==='in'){if(Number.isInteger(d.d)&&d.d>=0&&d.d<=4)dirs[2]=d.d;}
  else if(role===2&&d.t==='st'&&stOk(d)){
    dec(d.g);balls=d.b.map(([x,y,a,s])=>({x,y,a,s}));pos=[null,d.p[1],d.p[2]];
    if(d.d[2]!==deaths[2])flash=18;
    deaths=d.d;calc();
  }
}
function setDir(d){
  if(state!=='play')return;
  if(role===1)dirs[1]=d;
  else if(role===2){dirs[2]=d;if(conn&&conn.open)conn.send({t:'in',d});}
}
function cleanup(){
  session++;
  for(const o of [conn,call])try{o&&o.close();}catch(e){}
  for(const o of [peer,lobby])try{o&&o.destroy();}catch(e){}
  conn=call=peer=lobby=null;role=0;rv.srcObject=null;
}
function setRemote(s){rv.srcObject=s;rv.play().catch(()=>{});}
function beginMatch(r){
  track('match_start');role=r;initGame();state='play';$('ov').style.display='none';last=performance.now();
}
function peerGone(my){
  if(my!==session)return;
  cleanup();stopLocal();state='over';
  showOv('상대가 나갔어요','새로운 상대를 찾아볼까요?','다른 상대 찾기',startFind);
}
function fail(my){
  if(my!==session)return;
  cleanup();stopLocal();state='over';
  showOv('연결에 실패했어요','잠시 후 다시 시도해 주세요.','다시 찾기',startFind);
}
// 대기 슬롯(lobby)은 만남만 주선하고, 실제 게임은 임의 ID의 개인 방(peer)에서 진행해요.
// 그래서 매칭이 끝나면 슬롯이 바로 비어요.
function hostWait(p,my){
  lobby=p;let taken=false,going=false;
  showOv('상대를 기다리는 중…','다른 사람이 접속하면 바로 시작돼요.','취소',cancel);
  p.on('connection',c=>{
    if(taken||my!==session){c.on('open',()=>c.close());return;}
    taken=true;
    c.on('close',()=>{if(!going)taken=false;});
    c.on('open',()=>{
      const gp=new Peer();
      gp.on('error',()=>{});
      gp.on('open',id=>{
        if(!c.open||my!==session){try{gp.destroy();}catch(e){}taken=false;return;}
        going=true;peer=gp;
        c.send({t:'go',id});
        setTimeout(()=>{try{p.destroy();}catch(e){}if(lobby===p)lobby=null;},800);
        const to=setTimeout(()=>{if(!conn)fail(my);},12000);
        gp.on('connection',c2=>{
          if(conn){c2.on('open',()=>c2.close());return;}
          conn=c2;clearTimeout(to);
          c2.on('data',onData);c2.on('close',()=>peerGone(my));
          c2.on('open',()=>{
            c2.send({t:'ready'});
            call=gp.call(c2.peer,local);call.on('stream',setRemote);
            beginMatch(1);
          });
        });
      });
    });
  });
  p.on('error',()=>{});
}
function joinSlot(id,my){
  return new Promise(res=>{
    let done=false,tm;
    const p=new Peer();
    const fin=v=>{if(done)return;done=true;clearTimeout(tm);if(!v)try{p.destroy();}catch(e){}res(v);};
    tm=setTimeout(()=>fin(false),5000);
    p.on('error',()=>fin(false));
    p.on('call',cl=>{cl.answer(local);call=cl;cl.on('stream',setRemote);});
    p.on('open',()=>{
      const c=p.connect(id,{serialization:'json',reliable:true});
      c.on('error',()=>fin(false));
      c.on('close',()=>fin(false)); // 'go'를 받은 뒤의 종료는 무시됨
      c.on('data',d=>{
        if(!d||d.t!=='go'||done||typeof d.id!=='string'||!/^[\w.-]{1,64}$/.test(d.id))return;
        if(my!==session){fin(false);return;}
        peer=p;fin(true);
        const c2=p.connect(d.id,{serialization:'json',reliable:true});
        const to=setTimeout(()=>{if(!conn)fail(my);},12000);
        c2.on('data',m=>{
          if(m&&m.t==='ready'&&!conn){conn=c2;clearTimeout(to);beginMatch(2);}
          else onData(m);
        });
        c2.on('close',()=>{if(conn)peerGone(my);else fail(my);});
        c2.on('error',()=>{});
      });
    });
  });
}
function trySlot(id,my){
  return new Promise(res=>{
    let done=false;
    const fin=v=>{if(!done){done=true;res(v);}};
    const p=new Peer(id);
    p.on('open',()=>{
      if(my!==session){p.destroy();return fin(true);}
      hostWait(p,my);fin(true);
    });
    p.on('error',e=>{
      if(done)return;
      try{p.destroy();}catch(_){}
      if(e.type==='unavailable-id')joinSlot(id,my).then(fin);else fin(false);
    });
  });
}
async function find(){
  cleanup();const my=session;state='search';
  showOv('상대를 찾는 중…','잠시만 기다려 주세요.','취소',cancel);
  for(let r=0;r<2&&my===session;r++)
    for(let i=0;i<SLOTS&&my===session;i++)
      if(await trySlot(LOBBY+i,my))return;
  if(my===session)showOv('연결에 실패했어요','잠시 후 다시 시도해 주세요.','다시 찾기',startFind);
}
function cancel(){cleanup();stopLocal();state='menu';showOv('땅따먹기 대전',MENU_MSG,'상대 찾기',startFind,true);}
function stopLocal(){ // 매칭이 끝나거나 취소되면 카메라·마이크를 끔
  if(local)local.getTracks().forEach(t=>t.stop());
  local=null;lv.srcObject=null;
}
async function ensureLocal(){
  if(local)return true;
  const v={facingMode:'user',width:{ideal:960},height:{ideal:720}};
  try{local=await navigator.mediaDevices.getUserMedia({video:v,audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){try{local=await navigator.mediaDevices.getUserMedia({video:v,audio:false});}catch(e2){return false;}}
  lv.srcObject=local;lv.play().catch(()=>{});
  if(echoMode)audioOn(false);
  $('mic').textContent='마이크 끄기';
  return true;
}
async function startFind(){
  if(!consented){if(!$('ag').checked)return;consented=true;}
  if(!(await ensureLocal())){
    showOv('카메라 권한이 필요해요','브라우저의 카메라·마이크 권한(HTTPS 필요)을 허용한 뒤 다시 시도해 주세요.','다시 시도',startFind);return;
  }
  track('find_match');find();
}
$('re').onclick=startFind;
const audioOn=on=>{if(local)local.getAudioTracks().forEach(t=>t.enabled=on);};
$('echo').onclick=()=>{ // 켜면 평소엔 마이크를 끄고, 버튼을 누르는 동안만 말할 수 있어요
  echoMode=!echoMode;
  $('echo').textContent='에코 방지: '+(echoMode?'켜짐':'꺼짐');
  $('ptt').hidden=!echoMode;$('mic').hidden=echoMode;
  audioOn(!echoMode);$('mic').textContent='마이크 끄기';
};
const ptt=$('ptt'),talk=on=>{if(!echoMode)return;audioOn(on);ptt.classList.toggle('on',on);};
ptt.addEventListener('pointerdown',e=>{e.preventDefault();ptt.setPointerCapture(e.pointerId);talk(true);});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>ptt.addEventListener(ev,()=>talk(false)));
ptt.addEventListener('contextmenu',e=>e.preventDefault());
$('mic').onclick=()=>{
  if(!local)return;
  const t=local.getAudioTracks();if(!t.length)return;
  const on=!t[0].enabled;t.forEach(x=>x.enabled=on);
  $('mic').textContent=on?'마이크 끄기':'마이크 켜기';
};
function showOv(t,m,b,act,gate){
  $('ot').textContent=t;$('om').textContent=m;$('ob').textContent=b;obAct=act;
  const need=!!gate&&!consented;
  $('gate').style.display=need?'block':'none';
  $('ob').disabled=need&&!$('ag').checked;
  $('ov').style.display='flex';
}
$('ag').onchange=()=>{$('ob').disabled=!$('ag').checked;};
$('ob').onclick=()=>obAct&&obAct();

/* ---------- 그리기 ---------- */
function drawCam(){ // 내 영역에는 상대 카메라, 상대 영역에는 내 카메라
  const ok=[false,false,false],me=role||1;
  for(let k=1;k<=2;k++){
    const v=(3-k)===me?lv:rv,vw=v.videoWidth,vh=v.videoHeight;
    if(!vw)continue;
    lg.globalCompositeOperation='source-over';lg.clearRect(0,0,ly.width,ly.height);
    const sc=Math.max(cv.width/vw,cv.height/vh),dw=vw*sc,dh=vh*sc;
    lg.save();
    lg.translate(cv.width,0);lg.scale(-1,1); // 두 사람 화면이 똑같이 보이도록 모든 영상을 같은 방향으로 반전
    lg.drawImage(v,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);
    lg.restore();
    lg.globalCompositeOperation='destination-in';lg.imageSmoothingEnabled=false;
    lg.drawImage(mks[k],0,0,cv.width,cv.height);
    g.drawImage(ly,0,0);ok[k]=true;
  }
  return ok;
}
function draw(){
  g.fillStyle='#12343b';g.fillRect(0,0,cv.width,cv.height);
  if(!grid)return;
  const ok=drawCam();let cur=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=grid[y*W+x];if(!v)continue;
    let key,style;
    if(v<=2){const solid=!ok[v];key=v*2+(solid?1:0);style=solid?SOLID[v]:TINT[v];}
    else{key=10+v;style=COL[v-2];}
    if(key!==cur){g.fillStyle=style;cur=key;}
    g.fillRect(x*C,y*C,C,C);
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ // 영역 가장자리선
    const v=grid[y*W+x];if(v!==1&&v!==2)continue;
    g.fillStyle=COL[v];
    if(y<H-1&&grid[(y+1)*W+x]!==v)g.fillRect(x*C,y*C+C-2,C,2);
    if(y>0&&grid[(y-1)*W+x]!==v)g.fillRect(x*C,y*C,C,2);
    if(x<W-1&&grid[y*W+x+1]!==v)g.fillRect(x*C+C-2,y*C,2,C);
    if(x>0&&grid[y*W+x-1]!==v)g.fillRect(x*C,y*C,2,C);
  }
  for(const b of balls){
    g.fillStyle='#f1ead2';g.beginPath();g.arc(b.x*C,b.y*C,C*.9,0,7);g.fill();
    g.strokeStyle='#0b1c20';g.lineWidth=3;g.stroke();
  }
  for(let k=1;k<=2;k++){
    const[x,y]=pos[k];
    g.fillStyle='#0b1c20';g.fillRect(x*C-2,y*C-2,C+4,C+4);
    g.fillStyle=COL[k];g.fillRect(x*C+1,y*C+1,C-2,C-2);
    if(k===(role||1)){g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(x*C-4,y*C-4,C+8,C+8);}
  }
  if(flash>0){g.fillStyle='rgba(228,87,46,'+flash/40+')';g.fillRect(0,0,cv.width,cv.height);flash--;}
}
function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(state==='play'){
    if(role===1){
      acc+=dt;while(acc>=1/PS){acc-=1/PS;stepPlayer(1);stepPlayer(2);}
      for(const b of balls)if(stepBall(b,dt))break;
      sendT+=dt;
      if(sendT>=.05&&conn&&conn.open){sendT=0;conn.send({t:'st',g:enc(),b:balls.map(b=>[b.x,b.y,b.a,b.s]),p:pos,d:deaths});}
    }else if(role===2){for(const b of balls){b.x+=Math.cos(b.a)*b.s*dt;b.y+=Math.sin(b.a)*b.s*dt;}}
  }
  draw();requestAnimationFrame(loop);
}

/* ---------- 입력 ---------- */
const KEYS={ArrowUp:1,w:1,W:1,ArrowRight:2,d:2,D:2,ArrowDown:3,s:3,S:3,ArrowLeft:4,a:4,A:4};
addEventListener('keydown',e=>{
  if(state!=='play')return;
  if(KEYS[e.key]){setDir(KEYS[e.key]);e.preventDefault();}
  else if(e.key===' '){setDir(0);e.preventDefault();}
});
let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  const x=e.touches[0].clientX,y=e.touches[0].clientY,dx=x-tx,dy=y-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?2:4):(dy>0?3:1));tx=x;ty=y;
},{passive:false});

const MENU_MSG='접속한 사람 중 한 명과 연결돼요. 왼쪽(노랑)과 오른쪽(분홍) 기지에서 출발해 땅을 넓히세요. 내 땅에는 상대 카메라가, 상대 땅에는 내 카메라가 보여요. 기지는 상대가 들어오거나 차지할 수 없어요. 상대의 선을 끊거나, 상대가 서 있는 자리를 에워싸면 상대는 기지로 돌아가요. 승패는 없어요. 카메라·마이크는 상대에게만 직접 전달돼요.';
grid=new Uint8Array(W*H);
showOv('땅따먹기 대전',MENU_MSG,'상대 찾기',startFind,true);
requestAnimationFrame(loop);
</script>
